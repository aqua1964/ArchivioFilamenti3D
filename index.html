<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archivio Filamenti 3D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12 font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-cubes text-indigo-500 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">Archivio Filamenti 3D</h1>
      </div>
      <div class="text-xs text-slate-400">
        <i class="fa-solid fa-hard-drive text-emerald-400 mr-1"></i> Dati salvati in locale
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-8">

    <!-- Statistiche Dashboard -->
    <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-slate-400 text-xs font-semibold uppercase">Totale Bobine</div>
        <div id="stat-total-spools" class="text-2xl font-bold text-indigo-400 mt-1">0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-slate-400 text-xs font-semibold uppercase">Peso Rimanente</div>
        <div id="stat-total-weight" class="text-2xl font-bold text-emerald-400 mt-1">0 g</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-slate-400 text-xs font-semibold uppercase">Stampe Registrate</div>
        <div id="stat-total-prints" class="text-2xl font-bold text-amber-400 mt-1">0</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
        <div class="text-slate-400 text-xs font-semibold uppercase">Spesa Totale Acquisti</div>
        <div id="stat-total-spent" class="text-2xl font-bold text-rose-400 mt-1">0.00 €</div>
      </div>
    </section>

    <!-- Pulsanti Tab Navigation -->
    <div class="flex flex-wrap gap-2 border-b border-slate-700 pb-3">
      <button onclick="switchTab('inventory')" id="tab-inventory" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-indigo-600 text-white">
        <i class="fa-solid fa-boxes-stacked mr-2"></i>Inventario Filamenti
      </button>
      <button onclick="switchTab('purchases')" id="tab-purchases" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">
        <i class="fa-solid fa-receipt mr-2"></i>Storico Acquisti
      </button>
      <button onclick="switchTab('prints')" id="tab-prints" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-slate-800 text-slate-300 hover:bg-slate-700">
        <i class="fa-solid fa-print mr-2"></i>Registro Stampe
      </button>
    </div>

    <!-- SEZIONE INVENTARIO -->
    <div id="view-inventory" class="space-y-6">
      
      <!-- Modulo Aggiunta Bobina -->
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-semibold mb-4 text-indigo-400 flex items-center">
          <i class="fa-solid fa-plus-circle mr-2"></i>Aggiungi Nuova Bobina
        </h2>
        <form id="form-spool" onsubmit="addSpool(event)" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Marca / Produttore *</label>
            <input type="text" id="spool-brand" required placeholder="Es. Sunlu, Bambu Lab, Eryone" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Materiale *</label>
            <select id="spool-material" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="PLA">PLA</option>
              <option value="PLA+">PLA+</option>
              <option value="PETG">PETG</option>
              <option value="ABS">ABS</option>
              <option value="ASA">ASA</option>
              <option value="TPU">TPU</option>
              <option value="Nylon">Nylon</option>
              <option value="PC">PC (Policarbonato)</option>
              <option value="Altro">Altro</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Colore e Nome Colore *</label>
            <div class="flex space-x-2">
              <input type="color" id="spool-color-code" value="#3b82f6" class="h-9 w-12 bg-slate-900 border border-slate-700 rounded cursor-pointer p-1">
              <input type="text" id="spool-color-name" required placeholder="Es. Blu Elettrico" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Codice Fornitore / SKU</label>
            <input type="text" id="spool-sku" placeholder="Es. SUN-PLA-BLU-1000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Peso Iniziale / Attuale (g) *</label>
            <input type="number" id="spool-weight" required min="1" value="1000" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Temp. Ugello consigliata (°C)</label>
            <input type="text" id="spool-temp" placeholder="Es. 200 - 220" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div class="md:col-span-2">
            <label class="block text-xs font-medium text-slate-400 mb-1">Foto Bobina (File o URL)</label>
            <div class="flex space-x-2">
              <input type="file" id="spool-image-file" accept="image/*" class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-300 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-indigo-600 file:text-white file:text-xs">
              <input type="url" id="spool-image-url" placeholder="oppure URL..." class="w-1/2 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>
          <div class="md:col-span-3 lg:col-span-4 flex justify-end mt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-2 rounded-lg font-medium text-sm transition flex items-center">
              <i class="fa-solid fa-save mr-2"></i>Salva Bobina in Inventario
            </button>
          </div>
        </form>
      </div>

      <!-- Griglia Inventario Filamenti -->
      <div id="spools-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Generato dinamicamente -->
      </div>
    </div>

    <!-- SEZIONE STORICO ACQUISTI -->
    <div id="view-purchases" class="space-y-6 hidden">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-lg font-semibold mb-4 text-emerald-400 flex items-center">
          <i class="fa-solid fa-cart-plus mr-2"></i>Registra Nuovo Acquisto
        </h2>
        <form id="form-purchase" onsubmit="addPurchase(event)" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Data Acquisto *</label>
            <input type="date" id="purchase-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-medium text
